<!doctype html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} - {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <meta name="theme-color" content="#1f5eff">
    <link rel="icon" type="image/svg+xml" href="{{ '/assets/images/site-icon.svg' | relative_url }}">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/images/site-icon.png' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="{{ '/' | relative_url }}">
          <span class="brand-mark">QA</span>
          <span class="brand-text">
            <strong>{{ site.author.name }}</strong>
            <small>{{ site.author.role }} · AI 辅助测试</small>
          </span>
        </a>
        <nav class="nav" aria-label="主导航">
          {% for item in site.nav %}
            <a href="{{ item.url | relative_url }}">{{ item.title }}</a>
          {% endfor %}
        </nav>
      </div>
    </header>

    <main>
      {{ content }}
    </main>

    <footer class="site-footer">
      <div class="container footer-grid">
        <div>
          <strong>{{ site.title }}</strong>
          <p>把测试经验、AI 实践和项目复盘沉淀成长期可复用的知识。</p>
        </div>
        <div>
          <span>内容方向</span>
          <p>AI 测试 · 自动化测试 · 测试平台 · 质量效能</p>
        </div>
        <div>
          <span>联系合作</span>
          <a href="mailto:{{ site.author.email }}">{{ site.author.email }}</a>
        </div>
      </div>
    </footer>

    <details class="reward-float">
      <summary class="reward-float__trigger" aria-label="打赏作者">
        <span class="reward-float__icon" aria-hidden="true">赏</span>
        <span class="reward-float__label">
          <strong>打赏</strong>
          <small>微信支付</small>
        </span>
      </summary>
      <div class="reward-float__panel" role="dialog" aria-label="微信打赏">
        <p class="reward-float__title">微信打赏</p>
        <img
          src="{{ '/assets/images/wechat-reward.png' | relative_url }}"
          alt="微信打赏二维码"
          width="420"
          height="601"
          loading="lazy"
        >
        <p class="reward-float__note">微信扫一扫，支持一下。</p>
      </div>
    </details>
  </body>
</html>
